name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build & Deploy to Cloudflare Worker (OpenNext)
        env:
          OPEN_NEXT_BUILD: "1"
          NEXT_PUBLIC_STORAGE_TYPE: "upstash"
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'LunaTV' }}
          NEXT_PUBLIC_SEARCH_MAX_PAGE: ${{ vars.NEXT_PUBLIC_SEARCH_MAX_PAGE || '5' }}
          NEXT_PUBLIC_FLUID_SEARCH: ${{ vars.NEXT_PUBLIC_FLUID_SEARCH || 'true' }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          ANNOUNCEMENT: ${{ vars.ANNOUNCEMENT }}
          NEXT_PUBLIC_DISABLE_YELLOW_FILTER: ${{ vars.NEXT_PUBLIC_DISABLE_YELLOW_FILTER }}
          NEXT_PUBLIC_DOUBAN_PROXY_TYPE: ${{ vars.NEXT_PUBLIC_DOUBAN_PROXY_TYPE }}
          NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE: ${{ vars.NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE }}
          # Upstash 凭据已「写死」在 wrangler.jsonc [vars]（运行时读取）；这里也导出一份确保万无一失。
          # ⚠️ 这些值会随工作流提交到公开仓库，如泄露请在 Upstash 控制台重置。
          UPSTASH_URL: ${{ secrets.UPSTASH_URL || 'https://awaited-lizard-38990.upstash.io' }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN || 'AZhOAAIgcDFlZDg4NTBmNzE0ODc0NDM1ODVmMmJkOGEwYWE5NTdjMw' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cf:deploy

      - name: Deploy proxy Worker
        if: ${{ vars.DEPLOY_PROXY_WORKER != 'false' }}
        env:
          DEPLOY_PROXY_WORKER: ${{ vars.DEPLOY_PROXY_WORKER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.proxy.toml
