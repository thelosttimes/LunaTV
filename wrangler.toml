# LunaTV · Cloudflare Pages 配置
# 文档：./CLOUDFLARE_DEPLOY.md
#
# ⚠️ 重要：Cloudflare Pages 的 wrangler.toml 不支持 [build] 命令！
#   该 key 仅适用于 Workers；Pages 读取它会直接报错：
#   "Configuration file for Pages projects does not support \"build\""
#   构建命令必须在别处指定（二选一，不能写在 wrangler.toml）：
#   - 方式一（推荐，已在代码里定义）：GitHub Actions 工作流
#     .github/workflows/deploy-cloudflare.yml 中执行
#     node scripts/generate-manifest.js && npx @cloudflare/next-on-pages
#   - 方式二（原生 Git 集成）：在 Cloudflare 面板
#     Pages → lunatv → Settings → Build & deployments 设置
#     Build command      = node scripts/generate-manifest.js && npx @cloudflare/next-on-pages
#     Output directory   = .vercel/output/static
#     （并添加 Build 作用域环境变量 NEXT_PUBLIC_STORAGE_TYPE=upstash 等）

name = "lunatv"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# next-on-pages 构建产物目录。
# - 方式一（wrangler pages deploy 直接上传）：命令参数会覆盖此项，这里保留作文档。
# - 方式二（Git 集成）：Cloudflare 会读取此项作为发布目录。
pages_build_output_dir = ".vercel/output/static"

# 运行时环境变量（非机密）。
# 注意：NEXT_PUBLIC_* 必须在「构建时」通过 CI / 面板 Build 变量导出才会内联进前端包；
#       仅写在 [vars] 只会作为运行时变量，不会内联。
#
# ⚠️ 关键：因为本文件含 pages_build_output_dir，它是 Cloudflare Pages 的
#   「唯一事实来源(source of truth)」——面板里设置的同名变量/机密将被忽略，
#   运行时只读这里的 [vars]。因此运行时需要的 UPSTASH_URL/UPSTASH_TOKEN
#   必须写在这里，否则应用运行时会报 "UPSTASH_URL and UPSTASH_TOKEN env variables must be set"。
[vars]
NEXT_PUBLIC_STORAGE_TYPE = "upstash"
NEXT_PUBLIC_SITE_NAME = "LunaTV"
NEXT_PUBLIC_SEARCH_MAX_PAGE = "5"
NEXT_PUBLIC_FLUID_SEARCH = "true"
# Upstash 运行时凭据（已写死）。CF 运行时不支持 TCP，只能走 Upstash REST。
# ⚠️ 这些值会随公开仓库暴露，如怀疑泄露请到 Upstash 控制台重置 REST token 后更新此处。
UPSTASH_URL = "https://awaited-lizard-38990.upstash.io"
UPSTASH_TOKEN = "AZhOAAIgcDFlZDg4NTBmNzE0ODc0NDM1ODVmMmJkOGEwYWE5NTdjMw"
# 可选，按需取消注释并修改：
# SITE_BASE = "https://your-domain.pages.dev"
# ANNOUNCEMENT = "欢迎使用 LunaTV"
# NEXT_PUBLIC_DISABLE_YELLOW_FILTER = "false"
# NEXT_PUBLIC_DOUBAN_PROXY_TYPE = "cmliussss-cdn-tencent"
# NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE = "cmliussss-cdn-tencent"

# 管理员登录凭据（USERNAME / PASSWORD）如需运行时生效，同样要写在 [vars]（面板会被忽略）。
# 例如取消下面两行注释并填入你的值：
# USERNAME = "admin"
# PASSWORD = "your-strong-password"
